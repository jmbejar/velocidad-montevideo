# UI chrome drawn from the same palette as the charts, so controls and data
# never compete: slot-1 blue as the accent, the documented surfaces and inks.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
