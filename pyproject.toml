[project]
name = "mvdspeed"
version = "0.1.0"
description = "Exploration of Montevideo average-speed sensor open data"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "streamlit>=1.38",
    "pydeck>=0.9",
    "altair>=5.4",
]

[project.scripts]
mvdspeed-etl = "mvdspeed.etl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvdspeed"]
